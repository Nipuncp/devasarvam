# Devasarvam — Supabase CLI config (local dev)
# Docs: https://supabase.com/docs/reference/cli/config

project_id = "devasarvam"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = false           # Phase 2: admin invites users; no public signup
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = false                  # Not used yet; flip on if we add receipt PDF archive

[realtime]
enabled = true
